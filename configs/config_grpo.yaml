experiment:
  name: grpo1
  output_dir: outputs/grpo1
  data_path: data/sample_data/sample_data.json
  max_turns: 3
  token_ledger: token_usage_ledger.json
                                    # null → default EpisodeConfig (single persona) | all → 48 presets

plugins:
  # ── simulators (environment) — OpenRouter; provide the medical knowledge / dynamics ──
  user_llm:
    type: v2
    use_mask: false                # ablation toggle (Stage-3 mask)
    base_url: https://openrouter.ai/api/v1
    model: deepseek/deepseek-chat-v3-0324
    max_tokens: 256
    temperature: 0.8
    timeout: 45.0                  # per-call seconds before openai client aborts (default 45.0; SDK default w/o this is 600s)
    max_retries: 3                 # SDK-level retry w/ backoff on timeout/connection/5xx/429 (default 3)

  medical_llm:
    type: vllm
    base_url: https://openrouter.ai/api/v1
    model: deepseek/deepseek-chat-v3-0324
    max_tokens: 512
    temperature: 0.7
    timeout: 45.0
    max_retries: 3

  fact_validator_llm:
    type: vllm
    base_url: https://openrouter.ai/api/v1
    model: deepseek/deepseek-chat-v3-0324
    max_tokens: 384
    temperature: 0.0
    timeout: 45.0
    max_retries: 3

  final_judge:
    enabled: true                  # GRPO needs r_final (user reached gold)
    type: vllm
    base_url: https://openrouter.ai/api/v1
    model: deepseek/deepseek-chat-v3-0324
    max_tokens: 256
    temperature: 0.0
    timeout: 45.0
    max_retries: 3

  # ── policy = the GRPO-trained agent (local Qwen + LoRA) ──
  policy:
    type: local_baseline           # local_baseline | local_sft | local_full
    model: Qwen/Qwen3-8B
    trainable: true                # GRPO: LoRA, sampling, logprobs
    load_in_4bit: true             # QLoRA: 4-bit frozen base (~5GB) so 8B fits 24GB (set false only on a bigger GPU)
    # load_in_8bit handling not implemented yet — ask if you want the 8-bit option
    enable_thinking: false
    max_tokens: 32                 # action is short ("STAGE.locution"); keep small
    temperature: 0.8               # sampling temperature for exploration
    device: auto
    lora:
      r: 16
      alpha: 32
      dropout: 0.05
      target_modules: [q_proj, k_proj, v_proj, o_proj]   # + gate_proj, up_proj, down_proj for wider LoRA

action_space_path: configs/action_space.yaml

# ── GRPO + reward (reward.txt / r_align.txt) ──
grpo:
  group_size: 2               # trajectories sampled per (case, persona)
  kl_coef: 0.01                    # KL-to-reference penalty (k3 estimator)

reward:
  # lambda_align lowered from 1.0: r_align's BASE table is a hand-crafted shaping heuristic,
  # not a validated ground truth (see r_align.txt SS10) -- it should nudge, not compete with
  # r_final for the optimum. Revisit empirically once an interaction-scaling curve exists.
  lambda_align: 0.3                # process shaping (r_align.txt)
  lambda_final: 1.0                # outcome: user reached gold (final_judge)
  lambda_burden: 0.02              # interaction cost: penalize cumulative NASA-TLX burden
  lambda_fmt: 0.1                  # valid stage.locution format

training:
  learning_rate: 1.0e-5
  steps: 3                        # number of group updates
  save_every: 10
