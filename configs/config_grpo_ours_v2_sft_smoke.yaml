# GRPO v4-user smoke initialized from the v2 SFT LoRA adapter.
# Run after:
#   python scripts/train_sft.py --config configs/config_sft_v2_train.yaml
#
# Goal: verify SFT-initialized policy still samples diverse trajectories and GRPO updates move
# under the same v4 user-simulator family used by the v4 POC configs.
# This is a short paid/API smoke, not the final frontier run.
experiment:
  name: grpo_ours_v2_sft_v4_smoke
  output_dir: outputs/grpo_ours_v2_sft_v4_smoke
  data_path: data/sample_data/ours_v2_train_wrong.json
  max_turns: 4
  token_ledger: token_usage_ledger.json

action_space_path: configs/action_space_v2.yaml

plugins:
  user_llm:
    type: v4
    base_url: https://openrouter.ai/api/v1
    model: openai/gpt-4o-mini
    max_tokens: 512
    temperature: 0.8
    persona: exhausted_attending
    information_sparsity: dense
    force_full_turns: false
    show_options: true

  medical_llm:
    type: vllm
    base_url: https://openrouter.ai/api/v1
    model: deepseek/deepseek-v3.2
    frame_style: command
    max_tokens: 512
    temperature: 0.7

  fact_validator_llm:
    type: vllm
    base_url: https://openrouter.ai/api/v1
    model: deepseek/deepseek-v3.2
    max_tokens: 384
    temperature: 0.0

  final_judge:
    enabled: true
    type: vllm
    base_url: https://openrouter.ai/api/v1
    model: deepseek/deepseek-v3.2
    max_tokens: 256
    temperature: 0.0

  policy:
    type: ours_v2
    model: Qwen/Qwen3-8B
    adapter_path: outputs/sft_v2/sft/final
    trainable: true
    load_in_4bit: true
    enable_thinking: false
    use_fact_validator: true
    max_tokens: 320
    temperature: 0.8
    device: auto
    lora:
      r: 16
      alpha: 32
      dropout: 0.05
      target_modules: [q_proj, k_proj, v_proj, o_proj]

grpo:
  group_size: 6
  kl_coef: 0.01

reward:
  lambda_align: 0.0
  lambda_final: 1.0
  lambda_turn: 0.0
  lambda_burden: 0.0
  lambda_fmt: 0.0
  lambda_leak: 1.0

training:
  learning_rate: 1.0e-5
  steps: 5
  save_every: 5

concurrency: 6
