experiment:
  name: qwen_baseline
  seed: 42
  max_turns: 5
  output_dir: outputs/
  data_path: data/sample_data/sample_data.json
  ablation_mode: baseline_policy

plugins:
  user_llm:
    type: vllm
    base_url: http://localhost:8001/v1
    model: meta-llama/Meta-Llama-3.1-70B-Instruct
    max_tokens: 256
    temperature: 0.8

  medical_llm:
    type: vllm
    base_url: http://localhost:8001/v1
    model: meta-llama/Meta-Llama-3.1-70B-Instruct
    max_tokens: 512
    temperature: 0.7

  fact_validator_llm:
    type: vllm
    base_url: http://localhost:8001/v1
    model: meta-llama/Meta-Llama-3.1-70B-Instruct
    max_tokens: 256
    temperature: 0.0

  policy:
    type: baseline_policy
    base_url: http://localhost:8002/v1
    model: Qwen/Qwen3-8B
    max_tokens: 16
    temperature: 0.0
    enable_thinking: false   # Qwen3 thinking mode off for structured action output

action_space_path: configs/action_space.yaml

eval:
  enabled: false           # true → run MediCoBe eval after each episode
  methods:
    - medcobe
  output_dir: eval_results/
  judge:
    base_url: http://localhost:8001/v1
    model: meta-llama/Meta-Llama-3.1-70B-Instruct
    api_key: EMPTY
    temperature: 0.0
    batch_size: 20
