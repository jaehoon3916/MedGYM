# ─────────────────────────────────────────────────────────────────────────────
# v2 SFT training — 학생(로컬 Qwen + LoRA)을 sft_v2_distill이 만든 골든 JSON action에 imitation.
#   python scripts/train_sft.py --config configs/config_sft_v2_train.yaml
#   (데이터는 먼저 build_sft_data_v2.py --config configs/sft_v2_distill.yaml 로 생성)
#
# train_sft.py 는 plugins.policy 를 LocalQwenPolicy 로 로드(type 무관)하고, SFTTrainer 는
# 데이터의 {messages, action} 을 그대로 씀 — 정책 프롬프트 빌더를 안 타므로, 저장되는 LoRA 어댑터는
# GRPO 시 PolicyOursV2(같은 베이스 Qwen)가 그대로 로드해 이어받는다. action 타깃은 {stage, guidance} JSON.
# ─────────────────────────────────────────────────────────────────────────────

experiment:
  name: sft_v2
  output_dir: outputs/sft_v2                     # 체크포인트: outputs/sft_v2/sft/epoch_N, .../final
  data_path: outputs/sft_v2/sft_data_combined_200.jsonl   # (train_sft 는 미사용; sft.data_out 만 읽음)
  token_ledger: token_usage_ledger.json

plugins:
  # 학생 = 로컬 Qwen + LoRA. train_sft 는 type 무시하고 LocalQwenPolicy 로 로드(생성경로는 GRPO 때 PolicyOursV2).
  policy:
    type: ours_v2                  # 의미상 학생. (train_sft 내부는 LocalQwenPolicy 로 처리)
    model: Qwen/Qwen3-8B
    load_in_4bit: true             # QLoRA: 4-bit frozen base(~5GB)로 8B를 24GB GPU에.
    enable_thinking: false
    max_tokens: 128                # {stage, action_guidance} JSON 생성분(GRPO/추론 시). SFT 학습엔 무영향.
    temperature: 0.8               # GRPO 탐색용.
    device: auto
    lora:
      r: 16
      alpha: 32
      dropout: 0.05
      target_modules: [q_proj, k_proj, v_proj, o_proj]

action_space_path: configs/action_space_v2.yaml   # v2 필수 (SFT 데이터가 v2 control로 생성됨)

sft:
  data_out: outputs/sft_v2/sft_data_combined_200.jsonl   # veteran+exhausted 200 episode distill set (--data 로 덮어쓰기 가능)
  epochs: 2                                 # 과적합=엔트로피붕괴→GRPO그룹 동일화 방지로 작게
  batch_size: 4
  learning_rate: 1.0e-4
  save_every: 1                             # 매 epoch 체크포인트 → holdout NLL 상승 직전을 GRPO init으로
  holdout_frac: 0.1                         # >0 이면 매 epoch holdout NLL 출력(조기중단 신호)
  log_every: 1                               # step별 train NLL을 outputs/sft_v2/sft/metrics.jsonl에 기록
