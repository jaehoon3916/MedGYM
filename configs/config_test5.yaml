experiment:
  name: test5
  seed: 42
  max_turns: 5
  output_dir: outputs/test5
  data_path: data/sample_data/sample_data.json
  ablation_mode: baseline_policy   # naive | prompt | rule | baseline_policy | sft_policy | full_policy
  token_ledger: token_usage_ledger.json   # persistent cumulative token total across ALL runs (read-add-write, never overwritten)
  initial_user_state: [user_state_11, user_state_3, user_state_14, user_state_25]           # persona preset(s) in initial_user_state/. One episode per preset.
                                    #   null            → default EpisodeConfig (single run)
                                    #   user_state_5     → single preset
                                    #   [user_state_1, , user_state_5, user_state_9]  → list
                                    #   all              → all 48 presets
                                    # presets enumerate all 48 combos of initial_fact × certainty × authority_push × information_sparcity × safety_push

plugins:
  user_llm:
    type: vllm                                  # vllm (only option — mock removed)
    base_url: https://openrouter.ai/api/v1
    # base_url: http://localhost:8001/v1        # local vllm server
    model: deepseek/deepseek-chat-v3-0324
    # model: deepseek/deepseek-r1               # DeepSeek R1 (reasoning)
    # model: google/gemini-2.5-pro              # Gemini 2.5 Pro
    # model: anthropic/claude-sonnet-4-5        # Claude Sonnet
    # model: meta-llama/llama-3.3-70b-instruct  # Llama 3.3 70B
    # model: qwen/qwen3-235b-a22b               # Qwen3 235B MoE (OpenRouter)
    max_tokens: 256
    temperature: 0.8
    user_mask: true

  medical_llm:
    type: vllm
    base_url: https://openrouter.ai/api/v1
    # base_url: http://localhost:8001/v1
    model: deepseek/deepseek-chat-v3-0324
    # model: deepseek/deepseek-r1
    # model: google/gemini-2.5-pro
    # model: anthropic/claude-sonnet-4-5
    # model: meta-llama/llama-3.3-70b-instruct
    # model: qwen/qwen3-235b-a22b
    max_tokens: 512
    temperature: 0.7

  fact_validator_llm:
    type: vllm
    base_url: https://openrouter.ai/api/v1
    # base_url: http://localhost:8001/v1
    model: deepseek/deepseek-chat-v3-0324
    # model: deepseek/deepseek-r1
    # model: google/gemini-2.5-pro
    # model: anthropic/claude-sonnet-4-5
    # model: meta-llama/llama-3.3-70b-instruct
    # model: qwen/qwen3-235b-a22b
    max_tokens: 256
    temperature: 0.0

  final_judge:                                  # end-of-episode judge → final_judgement{concluded_option, is_correct} for accuracy
    enabled: false                           # false → skip final judgement (turn off during experiments)
    type: vllm                                  # vllm (only option)
    base_url: https://openrouter.ai/api/v1
    # base_url: http://localhost:8001/v1        # local vllm server
    model: deepseek/deepseek-chat-v3-0324
    # model: deepseek/deepseek-r1
    # model: google/gemini-2.5-pro
    # model: anthropic/claude-sonnet-4-5
    # model: meta-llama/llama-3.3-70b-instruct
    # model: qwen/qwen3-235b-a22b
    max_tokens: 256
    temperature: 0.0

  policy:
    type: local_baseline                        # naive | prompt | rule | baseline_policy | sft_policy | full_policy | local_baseline | local_sft | local_full
    # base_url: http://localhost:8002/v1        # vllm server (type: baseline_policy)
    model: Qwen/Qwen3-8B
    # model: Qwen/Qwen3-14B
    # model: Qwen/Qwen3.5-9B
    max_tokens: 512                             # local: max_new_tokens (set high for thinking mode)
    # max_tokens: 16                            # vllm: action token only
    device: auto                                # auto | cuda:0 | cuda:1 | ...
    enable_thinking: false                      # true: reasoning tokens on (for GRPO training)

action_space_path: configs/action_space.yaml

eval:
  enabled: false                                # true: run MedCoBe eval after each episode
  methods:
    - medcobe
  output_dir: eval_results/
  judge:
    base_url: https://openrouter.ai/api/v1
    # base_url: http://localhost:8001/v1
    model: deepseek/deepseek-chat-v3-0324
    # model: deepseek/deepseek-r1
    # model: google/gemini-2.5-pro
    # model: anthropic/claude-sonnet-4-5
    temperature: 0.0
    batch_size: 20
