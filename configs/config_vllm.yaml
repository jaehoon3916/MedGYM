experiment:
  name: test_vllm
  seed: 42
  max_turns: 5
  output_dir: outputs/
  data_path: data/sample_data/sample_data.json
  ablation_mode: naive   # naive | prompt | rule | baseline_policy | sft_policy | full_policy

plugins:
  user_llm:
    type: vllm             # mock | vllm
    base_url: http://localhost:8001/v1
    model: meta-llama/Llama-3.3-70B-Instruct
    max_tokens: 256
    temperature: 0.8

  medical_llm:
    type: vllm             # mock | vllm
    base_url: http://localhost:8001/v1
    model: meta-llama/Llama-3.3-70B-Instruct
    max_tokens: 512
    temperature: 0.7

  extractor_llm:
    type: vllm             # mock | rule | vllm
    base_url: http://localhost:8001/v1
    model: meta-llama/Llama-3.3-70B-Instruct
    max_tokens: 256
    temperature: 0.0

  policy:
    type: naive            # naive | prompt | rule | baseline_policy | sft_policy | full_policy

action_space_path: configs/action_space.yaml
