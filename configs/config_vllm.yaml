experiment:
  name: test_vllm
  seed: 42
  max_turns: 5
  output_dir: outputs/
  data_path: data/sample_data/sample_data.json
  ablation_mode: naive   # naive | prompt | rule | baseline_policy | sft_policy | full_policy

plugins:
  user_llm:
    type: v2               # v1 | v2 (see plugins/user_llm/user_simulator/)
    base_url: http://localhost:8001/v1
    model: meta-llama/Meta-Llama-3.1-70B-Instruct
    max_tokens: 256
    temperature: 0.8

  medical_llm:
    type: vllm             # mock | vllm
    base_url: http://localhost:8001/v1
    model: meta-llama/Meta-Llama-3.1-70B-Instruct
    max_tokens: 512
    temperature: 0.7

  fact_validator_llm:
    type: vllm             # mock | vllm
    base_url: http://localhost:8001/v1
    model: meta-llama/Meta-Llama-3.1-70B-Instruct
    max_tokens: 256
    temperature: 0.0

  policy:
    type: naive            # naive | prompt | rule | baseline_policy | sft_policy | full_policy

action_space_path: configs/action_space.yaml

eval:
  enabled: false           # true → run MediCoBe eval after each episode
  methods:
    - medcobe
  output_dir: eval_results/
  judge:
    base_url: http://localhost:8001/v1
    model: meta-llama/Meta-Llama-3.1-70B-Instruct
    api_key: EMPTY
    temperature: 0.0
    batch_size: 20
