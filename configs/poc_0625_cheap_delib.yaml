# poc_0625 — cheap deliberation (deepseek-v3.2 deliberation, no correct_option reveal)
# 비교군: 싼 모델 deliberation의 capability ceiling.

experiment:
  name: poc_0625_cheap_delib
  seed: 42
  max_turns: 8
  data_dir: data/sample_data
  n_cases: 20
  token_ledger: token_usage_ledger.json
  initial_user_state: null
  checkpoints: [1, 2, 3, 4, 5, 6, 7, 8]
  measure_ai_alone: true

plugins:
  user_llm:
    type: v3
    base_url: https://openrouter.ai/api/v1
    model: openai/gpt-4o-mini
    max_tokens: 256
    temperature: 0.8
    burden_samples_per_item: 3
    force_full_turns: true
    show_options: false
    persona: [veteran_attending, exhausted_attending, eager_resident, burned_out_resident]
    info_condition: full

  medical_llm:
    type: vllm
    base_url: https://openrouter.ai/api/v1
    model: deepseek/deepseek-v3.2
    frame_style: command
    max_tokens: 512
    temperature: 0.7

  fact_validator_llm:
    type: vllm
    base_url: https://openrouter.ai/api/v1
    model: deepseek/deepseek-v3.2
    max_tokens: 512
    temperature: 0.0

  final_judge:
    enabled: true
    type: vllm
    base_url: https://openrouter.ai/api/v1
    model: deepseek/deepseek-v3.2
    max_tokens: 256
    temperature: 0.0

  policy:
    type: deliberation_llm
    base_url: https://openrouter.ai/api/v1
    model: deepseek/deepseek-v3.2
    max_tokens: 512
    temperature: 0.0
    reveal_correct_option: false     # fact_validator 판정에만 의존 (정답 모름)

action_space_path: configs/action_space.yaml
concurrency: 10
