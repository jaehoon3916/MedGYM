# poc_0625 — oracle capability ceiling (gpt-5 deliberation, no correct_option reveal)
# 비교군: 가장 비싼 모델 deliberation이지만 정답은 모름. "모델 능력"의 상한선.
# ⚠️  비용 주의: gpt-5 × 8턴/episode × (n_cases × n_personas) 호출 발생.
#     스모크 테스트 시 n_cases를 작게 줄이거나 persona를 1개로 제한 권장.

experiment:
  name: poc_0625_oracle_cap
  seed: 42
  max_turns: 8
  data_dir: data/sample_data
  n_cases: 100
  token_ledger: token_usage_ledger.json
  initial_user_state: null
  checkpoints: [1, 2, 3,4, 5, 6, 7, 8]
  measure_ai_alone: true

plugins:
  user_llm:
    type: v3
    base_url: https://openrouter.ai/api/v1
    model: openai/gpt-4o-mini
    max_tokens: 256
    temperature: 0.8
    burden_samples_per_item: 3
    force_full_turns: true
    show_options: true
    persona: [veteran_attending]
    info_condition: full

  medical_llm:
    type: vllm
    base_url: https://openrouter.ai/api/v1
    model: deepseek/deepseek-v3.2
    frame_style: command
    max_tokens: 512
    temperature: 0.7

  fact_validator_llm:
    type: vllm
    base_url: https://openrouter.ai/api/v1
    model: deepseek/deepseek-v3.2
    max_tokens: 512
    temperature: 0.0

  final_judge:
    enabled: true
    type: vllm
    base_url: https://openrouter.ai/api/v1
    model: deepseek/deepseek-v3.2
    max_tokens: 256
    temperature: 0.0

  policy:
    type: deliberation_llm
    base_url: https://openrouter.ai/api/v1
    model: openai/gpt-5.2
    max_tokens: 512
    temperature: 0.0
    reveal_correct_option: false     # 정답 모름 -- capability만 비교

action_space_path: configs/action_space.yaml
concurrency: 10
