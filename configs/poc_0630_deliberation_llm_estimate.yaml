# poc_0630_deliberation_llm_estimate — deployable, NO-ground-truth counterpart to the meta
# oracle runs. Same seed/cases/persona/models as poc_0630_deliberation_llm_meta_oracle, but the
# policy is fed inference-time ESTIMATES instead of the true quadrant:
#   - doctor-side: the fact-verifier's overall_relation on the doctor's latest claim
#   - AI-side:     the medical AI's own self-reported per-turn confidence
# No correct_option, no ai_blind cache -- nothing ground-truth reaches the policy prompt.
#
# info_condition: full => sighted validator (see_case_info auto-True). This measures the CEILING
# of the estimate approach (strongest doctor-side signal); a blind/sparse follow-up run is the
# honest fully-deployable number, done separately once this establishes the ceiling.
#
# Compare final_acc / recovered / regressed against (all n=100, veteran_attending, deepseek-v3.2):
#   blind-full 0.60 / meta_oracle 0.66 / meta_oracle_raw 0.68 / oracle(answer) 0.83

experiment:
  name: poc_0630_deliberation_llm_estimate
  seed: 42
  max_turns: 8
  data_dir: data/sample_data
  n_cases: 100
  token_ledger: token_usage_ledger.json
  checkpoints: [1, 2, 3, 4, 5, 6, 7, 8]
  measure_ai_alone: true

plugins:
  user_llm:
    type: v3
    base_url: https://openrouter.ai/api/v1
    model: openai/gpt-4o-mini
    max_tokens: 256
    temperature: 0.8
    burden_samples_per_item: 3
    force_full_turns: true
    show_options: true
    persona: [veteran_attending]
    info_condition: full

  medical_llm:
    type: vllm
    base_url: https://openrouter.ai/api/v1
    model: deepseek/deepseek-v3.2
    frame_style: command
    max_tokens: 528
    temperature: 0.7

  fact_validator_llm:
    type: vllm
    base_url: https://openrouter.ai/api/v1
    model: deepseek/deepseek-v3.2
    max_tokens: 512
    temperature: 0.0

  final_judge:
    enabled: false
    type: vllm
    base_url: https://openrouter.ai/api/v1
    model: deepseek/deepseek-v3.2
    max_tokens: 256
    temperature: 0.0

  policy:
    type: deliberation_llm
    use_fact_validator: true
    base_url: https://openrouter.ai/api/v1
    model: deepseek/deepseek-v3.2
    max_tokens: 512
    temperature: 0.0
    reveal_correct_option: false
    reveal_quadrant_meta: false
    reveal_quadrant_meta_raw: false
    estimate_from_signals: true      # <-- deployable estimates, no ground truth

action_space_path: configs/action_space.yaml
concurrency: 100
