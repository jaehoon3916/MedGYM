# poc_0630_deliberation_llm_meta_oracle — same setup as poc_0630_deliberation_llm_oracle
# (identical seed/cases/persona/models) but the policy NEVER sees the correct option letter or
# option text. It only receives the meta fact: "your own independent judgment on this case was
# CORRECT/INCORRECT" (from the ai_blind cache) and "the clinician's current stated position is
# CORRECT/INCORRECT" (derived from dialogue_history vs the true answer, never shown to the
# policy). This is the realistic test of the framework -- the policy gets a TRUST signal to set
# its posture (assert confidently / defer / probe), not the destination. Compare its recovery
# rate on the AI_correct x Doctor_wrong / AI_wrong x Doctor_wrong quadrants against:
#   - poc_0630_deliberation_llm (blind, no oracle at all): 39.7% / 12.8%
#   - poc_0630_deliberation_llm_oracle (literal answer revealed -- capability ceiling): 76.7% / 63.2%
# This run's numbers are what should actually be reported as validating (or not) the
# risk-calibrated commitment-level framework -- the _oracle run must NOT be cited for that,
# since it trivially benefits from already knowing the destination.

experiment:
  name: poc_0630_deliberation_llm_meta_oracle
  seed: 42
  max_turns: 8
  data_dir: data/sample_data
  n_cases: 100
  token_ledger: token_usage_ledger.json
  initial_user_state: null
  checkpoints: [1, 2, 3, 4, 5, 6, 7, 8]
  measure_ai_alone: true

plugins:
  user_llm:
    type: v3
    base_url: https://openrouter.ai/api/v1
    model: openai/gpt-4o-mini
    max_tokens: 256
    temperature: 0.8
    burden_samples_per_item: 3
    force_full_turns: true
    show_options: true
    persona: [veteran_attending]
    info_condition: full

  medical_llm:
    type: vllm
    base_url: https://openrouter.ai/api/v1
    model: deepseek/deepseek-v3.2
    frame_style: command
    max_tokens: 512
    temperature: 0.7

  fact_validator_llm:
    type: vllm
    base_url: https://openrouter.ai/api/v1
    model: deepseek/deepseek-v3.2
    max_tokens: 512
    temperature: 0.0

  final_judge:
    enabled: false
    type: vllm
    base_url: https://openrouter.ai/api/v1
    model: deepseek/deepseek-v3.2
    max_tokens: 256
    temperature: 0.0

  policy:
    type: deliberation_llm
    use_fact_validator: true
    base_url: https://openrouter.ai/api/v1
    model: deepseek/deepseek-v3.2
    max_tokens: 512
    temperature: 0.0
    reveal_correct_option: false     # never reveal the letter/option text
    reveal_quadrant_meta: true        # <-- meta-only: CORRECT/INCORRECT labels only

action_space_path: configs/action_space.yaml
concurrency: 100
