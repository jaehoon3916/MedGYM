# poc_0630_deliberation_llm_meta_oracle_raw — same setup as poc_0630_deliberation_llm_meta_oracle
# (identical seed/cases/persona/models) but strips out the hand-written "-> do X" playbook that
# oracle_quadrant_block bakes in per quadrant. This variant hands the policy LLM the same two
# facts (its own independent no-dialogue correctness, the clinician's currently stated
# correctness) via oracle_quadrant_block_raw, with ZERO prescribed action attached -- what
# stage/locution/action_guidance to produce is left entirely to the policy LLM's own judgment
# (Step 1/Step 2 of the system prompt: infer hidden state, plan, pick the move).
#
# Why this run exists: poc_0630_deliberation_llm_meta_oracle's results (final_acc=0.660,
# recovered=0.389, regressed=0.022) answer "does OUR playbook, conditioned on the quadrant,
# work" -- not "can the policy LLM use a trust signal well on its own." Those are different
# questions. This run answers the second one. Compare against:
#   - poc_0630_deliberation_llm (blind, no signal at all): final_acc=0.600, recovered=0.292, regressed=0.115
#   - poc_0630_deliberation_llm_meta_oracle (facts + our hardcoded rules): final_acc=0.660, recovered=0.389, regressed=0.022
#   - poc_0630_deliberation_llm_oracle (literal answer -- capability ceiling): final_acc=0.830

experiment:
  name: poc_0630_deliberation_llm_meta_oracle_raw
  seed: 42
  max_turns: 8
  data_dir: data/sample_data
  n_cases: 100
  token_ledger: token_usage_ledger.json
  initial_user_state: null
  checkpoints: [1, 2, 3, 4, 5, 6, 7, 8]
  measure_ai_alone: true

plugins:
  user_llm:
    type: v3
    base_url: https://openrouter.ai/api/v1
    model: openai/gpt-4o-mini
    max_tokens: 256
    temperature: 0.8
    burden_samples_per_item: 3
    force_full_turns: true
    show_options: true
    persona: [veteran_attending]
    info_condition: full

  medical_llm:
    type: vllm
    base_url: https://openrouter.ai/api/v1
    model: deepseek/deepseek-v3.2
    frame_style: command
    max_tokens: 528
    temperature: 0.7

  fact_validator_llm:
    type: vllm
    base_url: https://openrouter.ai/api/v1
    model: deepseek/deepseek-v3.2
    max_tokens: 512
    temperature: 0.0

  final_judge:
    enabled: false
    type: vllm
    base_url: https://openrouter.ai/api/v1
    model: deepseek/deepseek-v3.2
    max_tokens: 256
    temperature: 0.0

  policy:
    type: deliberation_llm
    use_fact_validator: true
    base_url: https://openrouter.ai/api/v1
    model: deepseek/deepseek-v3.2
    max_tokens: 512
    temperature: 0.0
    reveal_correct_option: false      # never reveal the letter/option text
    reveal_quadrant_meta: false       # NOT the prescriptive-rule version
    reveal_quadrant_meta_raw: true    # <-- facts only, no playbook -- policy LLM decides

action_space_path: configs/action_space.yaml
concurrency: 100
