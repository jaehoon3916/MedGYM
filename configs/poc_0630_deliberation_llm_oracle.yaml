# poc_0630_deliberation_llm_oracle — same setup as poc_0630_deliberation_llm (identical
# seed/cases/persona/models) but with the policy's reveal_correct_option flag flipped on.
# Purpose: validate whether telling the policy the ground-truth correct option (so it
# knows, turn by turn, whether ITS OWN stance and the doctor's stance are right or wrong)
# lets it actually convert the AI_correct x Doctor_wrong quadrant above its blind baseline
# of 39.7% (n=73/250, computed from outputs/ai_blind_analysis.json + poc_0630_deliberation_llm
# results.json). Everything else held fixed so the comparison is apples-to-apples.

experiment:
  name: poc_0630_deliberation_llm_oracle
  seed: 42
  max_turns: 8
  data_dir: data/sample_data
  n_cases: 100
  token_ledger: token_usage_ledger.json
  initial_user_state: null
  checkpoints: [1, 2, 3, 4, 5, 6, 7, 8]
  measure_ai_alone: true

plugins:
  user_llm:
    type: v3
    base_url: https://openrouter.ai/api/v1
    model: openai/gpt-4o-mini
    max_tokens: 256
    temperature: 0.8
    burden_samples_per_item: 3
    force_full_turns: true
    show_options: true
    persona: [veteran_attending]
    info_condition: full

  medical_llm:
    type: vllm
    base_url: https://openrouter.ai/api/v1
    model: deepseek/deepseek-v3.2
    frame_style: command
    max_tokens: 528
    temperature: 0.7

  fact_validator_llm:
    type: vllm
    base_url: https://openrouter.ai/api/v1
    model: deepseek/deepseek-v3.2
    max_tokens: 512
    temperature: 0.0

  final_judge:
    enabled: false
    type: vllm
    base_url: https://openrouter.ai/api/v1
    model: deepseek/deepseek-v3.2
    max_tokens: 256
    temperature: 0.0

  policy:
    type: deliberation_llm
    use_fact_validator: true
    base_url: https://openrouter.ai/api/v1
    model: deepseek/deepseek-v3.2
    max_tokens: 512
    temperature: 0.0
    reveal_correct_option: true      # <-- the only diff vs poc_0630_deliberation_llm

action_space_path: configs/action_space.yaml
concurrency: 20
