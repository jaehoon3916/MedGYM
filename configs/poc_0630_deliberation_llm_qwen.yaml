# poc_0630 — deliberation_llm policy (fact_validator + LLM deliberation planner)
# poc_0630_naive와 직접 비교 가능: user_llm/medical_llm/persona/n_cases 동일.
# ablation 비교: deliberation_llm vs deliberation_llm_no_validator vs naive

experiment:
  name: poc_0630_deliberation_llm_qwen
  seed: 42
  max_turns: 8
  data_dir: data/sample_data
  n_cases: 100
  token_ledger: token_usage_ledger.json
  initial_user_state: null
  checkpoints: [1, 2, 3, 4, 5, 6, 7, 8]
  measure_ai_alone: true

plugins:
  user_llm:
    type: v3
    base_url: https://openrouter.ai/api/v1
    model: openai/gpt-4o-mini
    max_tokens: 256
    temperature: 0.8
    burden_samples_per_item: 3
    force_full_turns: true
    show_options: true
    persona: [veteran_attending]
    info_condition: full

  medical_llm:
    type: vllm
    base_url: https://openrouter.ai/api/v1
    model: deepseek/deepseek-v3.2
    frame_style: command
    max_tokens: 528
    temperature: 0.7

  fact_validator_llm:
    type: vllm
    base_url: https://openrouter.ai/api/v1
    model: deepseek/deepseek-v3.2
    max_tokens: 512
    temperature: 0.0

  final_judge:
    enabled: false
    type: vllm
    base_url: https://openrouter.ai/api/v1
    model: deepseek/deepseek-v3.2
    max_tokens: 256
    temperature: 0.0

  policy:
    type: deliberation_llm
    use_fact_validator: true         # validator ON (default). false -> ablation (no_validator config)
    base_url: https://openrouter.ai/api/v1
    model: qwen/qwen3-8b
    max_tokens: 512
    temperature: 0.0
    reveal_correct_option: false

action_space_path: configs/action_space.yaml
concurrency: 20
