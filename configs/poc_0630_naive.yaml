# poc_0625 — naive baseline (no deliberation, force_full_turns=true)
# 비교군: deliberation 없이 max_turns까지 강제 진행.
# poc_sp_naive(force_full_turns=false)와 직접 비교 불가 -- poc_0625 내부끼리만 비교.

experiment:
  name: poc_0630_naive
  seed: 42
  max_turns: 8
  data_dir: data/sample_data
  n_cases: 250
  token_ledger: token_usage_ledger.json
  checkpoints: [1, 2, 3, 4, 5, 6, 7, 8]
  measure_ai_alone: true           # ai_alone_accuracy 측정 (의사 없이 one-shot MCQ)

plugins:
  user_llm:
    type: v3
    base_url: https://openrouter.ai/api/v1
    model: openai/gpt-4o-mini
    max_tokens: 256
    temperature: 0.8
    burden_samples_per_item: 3
    force_full_turns: true           # END 무시하고 max_turns까지 강제 진행
    show_options: true
    persona: [veteran_attending]
    info_condition: full

  medical_llm:
    type: vllm
    base_url: https://openrouter.ai/api/v1
    model: deepseek/deepseek-v3.2
    frame_style: command
    max_tokens: 528
    temperature: 0.7

  final_judge:
    enabled: true
    type: vllm
    base_url: https://openrouter.ai/api/v1
    model: deepseek/deepseek-v3.2
    max_tokens: 256
    temperature: 0.0

  policy:
    type: naive

action_space_path: configs/action_space.yaml
concurrency: 20
