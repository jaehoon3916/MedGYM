# GRPO Phase-2 training — burden cost (docs/problem_formulation.md §5), same v4 user simulator +
# SFT-initialized ours_v2 policy as poc_0703_grpo_phase1.yaml (accuracy-only + turn cost).
#
# Purpose:
#   lambda_burden=0.02 is the sweep's starting point (see reward: below), not a settled value —
#   compare acc/regressed/mean_burden against phase1's turn-cost run before deciding whether to
#   sweep further lambda_burden values.
#
# Evaluate after training with:
#   python scripts/run_poc.py --config configs/poc_0630_ours_v4_sft.yaml
#   python scripts/run_poc.py --config configs/poc_0630_ours_v4_grpo_sft_smoke.yaml

experiment:
  name: poc_0703_grpo_phase2
  seed: 42
  output_dir: outputs/grpo_phase2
  # Wrong-anchored cases give mixed outcomes more often, so sparse final reward creates
  # nonzero GRPO advantages. Use balanced_100 only after this phase shows a clean signal.
  data_path: data/sample_data/heldout_50_excluding_sft.json
  max_turns: 8
  token_ledger: token_usage_ledger.json

action_space_path: configs/action_space_v2.yaml

plugins:
  user_llm:
    type: v4
    base_url: https://openrouter.ai/api/v1
    model: openai/gpt-4o-mini
    max_tokens: 512
    temperature: 0.8
    persona: [veteran_attending,exhausted_attending, eager_resident, burned_out_resident]
    information_sparsity: dense
    force_full_turns: false
    show_options: true

  medical_llm:
    type: vllm
    base_url: https://openrouter.ai/api/v1
    model: deepseek/deepseek-v4-pro
    frame_style: command
    max_tokens: 512
    temperature: 0.7

  fact_validator_llm:
    type: vllm
    base_url: https://openrouter.ai/api/v1
    model: deepseek/deepseek-v4-pro
    max_tokens: 384
    temperature: 0.0

  # Unused on the GRPO training path: is_correct comes from the v4 persona's own terminal
  # self-report (core/environment.py: Env._finalize), not a separate judge. final_judge.judge()
  # is only called from scripts/run_poc.py (eval). build_plugins defaults enabled=true when this
  # key is absent, so it must be explicitly false here rather than deleted.
  final_judge:
    enabled: false

  policy:
    type: ours_v2
    model: Qwen/Qwen3-8B
    adapter_path: outputs/sft_v2/sft/final
    trainable: true
    load_in_4bit: true
    enable_thinking: false
    use_fact_validator: true
    max_tokens: 320
    temperature: 0.8
    device: auto
    lora:
      r: 16
      alpha: 32
      dropout: 0.05
      target_modules: [q_proj, k_proj, v_proj, o_proj]

grpo:
  group_size: 6
  # Parallel rollout workers per group. rollout_workers=1 does NOT help the OOM (that is the UPDATE
  # phase's 4bit dequant backward, which is sequential regardless) -- it only serialized the API
  # calls and made every step ~6x slower. Restored to group_size for API overlap; run on 2 GPUs
  # (CUDA_VISIBLE_DEVICES=2,3) so the update backward has 48 GB instead of fighting one 24 GB card.
  rollout_workers: 6
  kl_coef: 0.1

reward:
  # Phase 2 (burden frontier): lambda_turn=0 -- turn and burden costs are alternatives being
  # compared (vs. phase1's turn-cost run), not additive. burden_t in [1,5]/turn, max_turns=8 =>
  # Sigma ~10-25/episode, so 0.02 keeps the penalty ~0.2-0.5 vs r_final=1.0 (nudge, not a rival).
  # Watch `regressed` in train_log.jsonl -- if it rises, this is already too high.
  lambda_align: 0.0
  lambda_final: 1.0
  lambda_turn: 0.0
  lambda_burden: 0.02
  lambda_fmt: 0.0
  lambda_leak: 1.0

training:
  learning_rate: 5.0e-6
  # 50 cases x 4 personas = 200 items (see train_grpo.py); steps=200 with the shuffle there
  # gives exactly one full pass instead of only the first ~8 cases in file order.
  steps: 200
  save_every: 10

concurrency: 6
