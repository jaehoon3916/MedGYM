# GRPO on action_space_v3 (EXTEND/RECOMMEND) — first real training run, starting from
# outputs/sft_v3/sft/final (PolicyOursV3, see configs/sft_v3_train.yaml).
#
# Reward = accuracy + burden + fmt (lambda_turn=0, lambda_leak=0 -- see reward: below for why).
# Mirrors poc_0703_grpo_phase2.yaml's plugin block (v4 user_llm, deepseek-v3.2 medical/validator)
# but swaps action_space_v2/ours_v2 -> action_space_v3/ours_v3 and the adapter_path/init.
#
# Evaluate after training with a run_poc.py config pointed at this run's outputs/grpo_v3/final
# adapter (same pattern as poc_0630_ours_v4_grpo_sft_smoke.yaml did for sft_v2).

experiment:
  name: poc_0706_grpo_v3_belief
  seed: 42
  output_dir: outputs/grpo_v3_belief
  # Same heldout set phase1/2 used -- both sft_v2 and sft_v3 were distilled from
  # balanced_100.json (see sft_v3_distill_naive.yaml/sft_v3_distill_quadrant_oracle.yaml), so
  # this exclusion still holds for the v3 checkpoint.
  data_path: data/sample_data/heldout_50_excluding_sft.json
  max_turns: 8
  token_ledger: token_usage_ledger.json

action_space_path: configs/action_space_v3.yaml

plugins:
  user_llm:
    type: v4
    base_url: https://openrouter.ai/api/v1
    model: openai/gpt-4o-mini
    max_tokens: 512
    temperature: 0.8
    persona: [veteran_attending, exhausted_attending, eager_resident, burned_out_resident]
    information_sparsity: dense
    # Ignore ordinary agreement/END so the policy is not rewarded merely for making the
    # clinician stop early. Still end immediately on excessive cognitive burden.
    force_full_turns: true
    burden_dropout_ends_forced_full_turns: true
    # Empirical p85 of max cumulative burden by persona over 400 full rollouts
    # (scripts/analyze_burden_dropout_thresholds.py, target dropout ~=15%).
    burden_dropout_threshold:
      veteran_attending: 25.0
      exhausted_attending: 20.0
      eager_resident: 25.0
      burned_out_resident: 20.0
    show_options: true

  medical_llm:
    type: vllm
    base_url: https://openrouter.ai/api/v1
    model: deepseek/deepseek-v3.2
    frame_style: command
    max_tokens: 512
    temperature: 0.7

  fact_validator_llm:
    type: vllm
    base_url: https://openrouter.ai/api/v1
    model: deepseek/deepseek-v3.2
    max_tokens: 384
    temperature: 0.0

  # is_correct comes from the v4 persona's own terminal self-report (core/environment.py:
  # Env._finalize), not final_judge -- must be explicitly false (build_plugins defaults true).
  final_judge:
    enabled: false

  policy:
    type: ours_v3
    model: Qwen/Qwen3-8B
    adapter_path: outputs/sft_v3/sft/final
    trainable: true
    load_in_4bit: false
    enable_thinking: false
    use_fact_validator: true
    max_tokens: 320
    temperature: 0.8
    device: auto
    lora:
      r: 16
      alpha: 32
      dropout: 0.05
      target_modules: [q_proj, k_proj, v_proj, o_proj]

grpo:
  group_size: 6
  rollout_workers: 6
  kl_coef: 0.1

reward:
  # Stage 2: accuracy plus continuous belief-potential shaping. The dialogue normally runs to
  # max_turns=8; burden only affects reward when it crosses the dropout threshold and forces an
  # early, dishonorable stop.
  lambda_final: 1.0
  lambda_belief: 0.3
  lambda_turn: 0.0
  lambda_burden: 0.0
  lambda_burden_dropout: 0.5
  lambda_fmt: 0.0
  # Uses leak_score_v3: answer-naming guidance is penalized only when it cannot be attributed to
  # the medical LLM's own mapped belief. Raw leak_score remains too strict for v3 RECOMMEND.
  lambda_leak: 0.0

training:
  learning_rate: 5.0e-6
  # 50 cases x 4 personas = 200 items (train_grpo.py); steps=200 = one full shuffled pass.
  steps: 200
  save_every: 20

concurrency: 6
