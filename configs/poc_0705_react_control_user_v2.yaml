# ReAct baseline for action_space_v3 (A3: EXTEND / RECOMMEND).
#
# Prompted Thought->Action planner (plugins/policy/react_control_v3_policy.py) -- the Thought step
# explicitly infers the clinician's belief state, confidence, and burden sensitivity from the
# dialogue (no ground truth; contrast with poc_0704_user_state_oracle_a3.yaml, which is GIVEN
# those same three things perfectly instead of inferring them).
#
# Usage:
#   python scripts/run_poc.py --config configs/poc_0705_react_control_v3.yaml

experiment:
  name: poc_0705_react_control_user_v2
  seed: 42
  max_turns: 8
  data_dir: data/sample_data
  n_cases: 25
  token_ledger: token_usage_ledger.json
  checkpoints: [1, 2, 3, 4, 5, 6, 7, 8]
  measure_ai_alone: true
  ai_alone_cache: outputs/_cache/ai_alone_deepseek_v3_2.json

plugins:
  user_llm:
    type: v2
    base_url: https://openrouter.ai/api/v1
    model: openai/gpt-4o-mini
    max_tokens: 512
    temperature: 0.8
    burden_samples_per_item: 3
    force_full_turns: true
    show_options: true
    persona: [veteran_attending, exhausted_attending, eager_resident, burned_out_resident]
    info_condition: full
    information_sparsity: dense

  medical_llm:
    type: vllm
    base_url: https://openrouter.ai/api/v1
    model: deepseek/deepseek-v3.2
    frame_style: command
    show_case_info: true
    max_tokens: 512
    temperature: 0.7

  fact_validator_llm:
    type: vllm
    base_url: https://openrouter.ai/api/v1
    model: deepseek/deepseek-v3.2
    max_tokens: 384
    temperature: 0.0

  final_judge:
    enabled: false

  policy:
    type: react_control_v3
    use_fact_validator: true
    base_url: https://openrouter.ai/api/v1
    model: deepseek/deepseek-v3.2
    max_tokens: 512
    temperature: 0.0

action_space_path: configs/action_space_v3.yaml
concurrency: 25
