# Identical to configs/poc_action_v3_naive.yaml except experiment.name/output_dir -- writes to
# outputs/poc_action_v3_naive_postmerge/ instead of outputs/poc_action_v3_naive/ so it does NOT
# clobber the existing pre-merge rollouts.
#
# Why this exists: the data currently in outputs/poc_action_v3_naive/*/rollouts/* was collected
# BEFORE action_space_v3.yaml's 2026-07-04 edit that dropped the McBurney locution/type sublayer
# (see action_space_v3.yaml's header). Under the old spec, plugins/policy/action_space_llm_policy.py
# also asked the LLM to pick a `locution`/`locution_type` alongside `stage`/`action_guidance`
# (extra fields in the prompt + JSON schema); under the current spec it does not -- so the exact
# generation process that produced the analyzed 108-turn dataset is not identical to what this
# config now runs, even though the EXTEND/RECOMMEND stage descriptions themselves are unchanged
# word-for-word. Run this to get a rollout set collected under the CURRENT (post-merge) spec.
#
# Usage: python scripts/run_poc.py --config configs/poc_action_v3_naive_postmerge.yaml
# Then:  python scripts/analyze_action_space_v3_burden.py \
#          --glob "outputs/poc_action_v3_naive_postmerge/*/rollouts/*.jsonl" \
#          --out-dir outputs/action_space_v3_burden_analysis_postmerge

experiment:
  name: poc_action_v3_naive_postmerge
  seed: 42
  output_dir: outputs/action_space_v3_naive_postmerge
  data_path: data/sample_data/action_v3_probe_8.json
  max_turns: 8
  token_ledger: token_usage_ledger.json

action_space_path: configs/action_space_v3.yaml

plugins:
  user_llm:
    type: v4
    base_url: https://openrouter.ai/api/v1
    model: openai/gpt-4o-mini
    max_tokens: 512
    temperature: 0.8
    persona: [veteran_attending, exhausted_attending, eager_resident, burned_out_resident]
    information_sparsity: dense
    force_full_turns: false
    show_options: true

  medical_llm:
    type: vllm
    base_url: https://openrouter.ai/api/v1
    model: deepseek/deepseek-v3.2
    frame_style: command
    max_tokens: 512
    temperature: 0.7

  fact_validator_llm:
    type: vllm
    base_url: https://openrouter.ai/api/v1
    model: deepseek/deepseek-v3.2
    max_tokens: 384
    temperature: 0.0

  final_judge:
    enabled: false

  policy:
    type: action_space_llm
    base_url: https://openrouter.ai/api/v1
    model: deepseek/deepseek-v3.2
    max_tokens: 320
    temperature: 0.7
    use_fact_validator: true

concurrency: 8
