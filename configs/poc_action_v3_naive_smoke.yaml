# Smoke test only -- 1 case, 1 persona, max_turns=4 -- to verify the action_space_llm policy +
# action_space_v3.yaml wiring works end to end before spending the full 8-case x 4-persona
# budget (see configs/poc_action_v3_naive.yaml, which this mirrors otherwise).

experiment:
  name: poc_action_v3_naive_smoke
  seed: 42
  output_dir: outputs/action_space_v3_naive_smoke
  data_path: data/sample_data/action_v3_probe_8.json
  n_cases: 1
  max_turns: 4
  token_ledger: token_usage_ledger.json

action_space_path: configs/action_space_v3.yaml

plugins:
  user_llm:
    type: v4
    base_url: https://openrouter.ai/api/v1
    model: openai/gpt-4o-mini
    max_tokens: 512
    temperature: 0.8
    persona: veteran_attending
    information_sparsity: dense
    force_full_turns: false
    show_options: true

  medical_llm:
    type: vllm
    base_url: https://openrouter.ai/api/v1
    model: deepseek/deepseek-v3.2
    frame_style: command
    max_tokens: 512
    temperature: 0.7

  fact_validator_llm:
    type: vllm
    base_url: https://openrouter.ai/api/v1
    model: deepseek/deepseek-v3.2
    max_tokens: 384
    temperature: 0.0

  final_judge:
    enabled: false

  policy:
    type: action_space_llm
    base_url: https://openrouter.ai/api/v1
    model: deepseek/deepseek-v3.2
    max_tokens: 320
    temperature: 0.7
    use_fact_validator: true

concurrency: 2
