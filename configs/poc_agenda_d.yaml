# Agenda Planner D-arm PoC
# scripts/run_agenda_poc.py -- AgendaEnvironment with Disagreement Analyzer + Resolution Tracker
#
# Pipeline:
#   reset():
#     1. AI-alone solo solve → (ai_option, ai_rationale)
#     2. user turn 0 → clinician initial opinion
#     3. Disagreement Analyzer(human vs AI + case grounding, no verdict) → agenda[2-3]
#   step(turn 0): forced SHARE_AGENDA response
#   step(turns >= 1):
#     5. AgendaActionPolicy(current_item, full action_space) → action → medical → user
#     6. ResolutionTracker(current_item, recent exchange) → resolved? → pointer++
#   termination: agenda_complete | agreement | burden_dropout | max_turns
#
# Complementarity = joint_correct - max(human_alone_correct, ai_alone_correct)
# (method.txt §6 rule: judge outside metric loop)

experiment:
  name: poc_agenda_d_smoke
  seed: 42
  max_turns: 10             # covers SHARE_AGENDA(0) + 8 deliberation turns + buffer
  data_dir: data/sample_data
  n_cases: 3                # smoke: 3 cases. Increase to 25+ for real run.
  token_ledger: token_usage_ledger.json
  checkpoints: [1, 2, 3, 4, 5, 6, 7, 8]

plugins:
  user_llm:
    type: v3
    base_url: https://openrouter.ai/api/v1
    model: openai/gpt-4.1-mini
    max_tokens: 256
    temperature: 0.8
    burden_samples_per_item: 3
    force_full_turns: true   # real termination: agreement / burden_dropout / max_turns
    show_options: true
    persona: veteran_attending
    info_condition: full

  medical_llm:
    type: vllm
    base_url: https://openrouter.ai/api/v1
    model: deepseek/deepseek-v3.2
    frame_style: command
    max_tokens: 512
    temperature: 0.7

  # fact_validator_llm is wired to AgendaEnvironment's base constructor but never called
  # internally (overridden). Kept for config compatibility with build_plugins().
  fact_validator_llm:
    type: vllm
    base_url: https://openrouter.ai/api/v1
    model: deepseek/deepseek-v3.2
    max_tokens: 128
    temperature: 0.0

  # Disagreement Analyzer: human vs AI opinion → 2-3 agenda items (no truth verdict)
  agenda_planner:
    type: vllm
    base_url: https://openrouter.ai/api/v1
    model: deepseek/deepseek-v3.2
    max_tokens: 512
    temperature: 0.0

  # resolution_tracker 불필요: policy의 CLOSE 선택이 pointer 전진 역할을 함.
  # (agenda_action_policy.yaml: CLOSE = "이 item 끝, 다음으로" / 마지막 item이면 종료)

  policy:
    type: agenda_action
    base_url: https://openrouter.ai/api/v1
    model: deepseek/deepseek-v3.2
    max_tokens: 512
    temperature: 0.0

  final_judge:
    enabled: false             # joint_correct via final_judge (show_options=false fallback)
    type: vllm
    base_url: https://openrouter.ai/api/v1
    model: deepseek/deepseek-v3.2
    max_tokens: 256
    temperature: 0.0

action_space_path: configs/action_space.yaml

concurrency: 3              # smoke: low concurrency
