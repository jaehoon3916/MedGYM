# Same as configs/scaling_poc_persona_sweep.yaml but with plugins.policy.type=react -- the
# ReAct-style baseline (Thought+Action call choosing ARGUE/ACCEPT/DEFER, blind to
# verification_template like medcobe_naive/medcobe_feedback). See plugins/policy/react_policy.py.
#
# Driven by scripts/run_persona_sweep.py (see scaling_poc_persona_sweep.yaml's header comment
# for the full mechanics). persona/plugins.user_llm.persona is a LIST here, so this file is
# NOT meant to be run standalone via run_scaling_poc.py directly -- always go through
# run_persona_sweep.py.

experiment:
  name: scaling_poc_persona_react
  seed: 42
  max_turns: 8
  data_dir: data/sample_data
  n_cases: 25
  token_ledger: token_usage_ledger.json
  initial_user_state: null

  checkpoints: [1, 2, 3, 4, 5, 6, 7, 8]

plugins:
  user_llm:
    type: v1
    base_url: https://openrouter.ai/api/v1
    model: deepseek/deepseek-v3.2
    max_tokens: 256
    temperature: 0.8
    burden_samples_per_item: 3
    force_full_turns: true
    show_options: false
    # persona: veteran_attending | exhausted_attending | eager_resident | burned_out_resident (see persona/personas.yaml).
    persona: [veteran_attending, exhausted_attending, eager_resident, burned_out_resident]
    # info_condition: full | dense | sparse (see scaling_poc_persona_sweep.yaml's comment for the 3-condition design).
    info_condition: [full]

  medical_llm:
    type: vllm
    base_url: https://openrouter.ai/api/v1
    model: deepseek/deepseek-v3.2
    frame_style: command
    max_tokens: 512
    temperature: 0.7

  final_judge:
    enabled: true
    type: vllm
    base_url: https://openrouter.ai/api/v1
    model: deepseek/deepseek-v3.2
    max_tokens: 256
    temperature: 0.0

  policy:
    type: react   # naive | medcobe_naive | react | medcobe_feedback | prompt | rule | oracle | baseline_policy | sft_policy | full_policy
    # react_policy.py is a VLLMBasePlugin -- it makes its OWN extra LLM call (the Thought+Action
    # decision), separate from medical_llm above. base_url/model/max_tokens/temperature here
    # configure THAT call (can differ from medical_llm's, e.g. cheaper/faster judge model).
    base_url: https://openrouter.ai/api/v1
    model: deepseek/deepseek-v3.2
    max_tokens: 256
    temperature: 0.0

action_space_path: configs/action_space.yaml

concurrency: 20
