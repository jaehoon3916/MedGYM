# Same as configs/scaling_poc.yaml but using user_llm.type=v3 (two-stage, persona-aware
# NASA-TLX burden self-report + combined belief/confidence/decision/response utterance call)
# instead of v1 (single-axis 0-3 third-person burden judge + r*q_t_prior amplification). See
# plugins/user_llm/user_simulator/v3.py and /home/kjy/.claude/plans/wild-tumbling-glade.md.
#
# NOT wired into scripts/run_scaling_poc.py yet -- that script hardcodes UserSimulatorV1
# (does not go through core.config.build_plugins's _user_llm_map). Wiring v3 into that
# harness is an explicit follow-up, not part of this config's current usability: this config
# is usable today via a small standalone driver that calls UserSimulatorV3 directly (see the
# plan's section 8 smoke-test sketch), and will be usable through run_scaling_poc.py once
# that follow-up lands.

experiment:
  name: scaling_poc_v3_naive_options_off
  seed: 42
  max_turns: 8
  data_path: data/sample_data/jama_raw_cardiology.json
  n_cases: 20
  token_ledger: token_usage_ledger.json
  initial_user_state: null
  checkpoints: [1, 2, 4, 8]

plugins:
  user_llm:
    type: v3                                     # v1 | v2 | v3
    base_url: https://openrouter.ai/api/v1
    model: deepseek/deepseek-v3.2
    max_tokens: 256
    temperature: 0.8
    burden_samples_per_item: 3                   # Stage-1 NASA-TLX judge calls per AI turn, averaged
    apply_authority_amplification: false          # placeholder only, no multiplier wired yet -- see plan section A
    force_full_turns: true
    show_options: false
    persona: burned_out_resident                  # veteran_attending | exhausted_attending | eager_resident | burned_out_resident
    information_sparsity: dense                   # dense | sparse

  medical_llm:
    type: vllm
    base_url: https://openrouter.ai/api/v1
    model: deepseek/deepseek-v3.2
    frame_style: command
    max_tokens: 512
    temperature: 0.7

  fact_validator_llm:
    type: vllm
    base_url: https://openrouter.ai/api/v1
    model: deepseek/deepseek-v3.2
    max_tokens: 256
    temperature: 0.0

  final_judge:
    enabled: true
    type: vllm
    base_url: https://openrouter.ai/api/v1
    model: deepseek/deepseek-v3.2
    max_tokens: 256
    temperature: 0.0

  policy:
    type: naive

action_space_path: configs/action_space.yaml

concurrency: 20
