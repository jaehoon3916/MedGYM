fields:
  # --- Conversation Locutions ---
  - name: dialogue_stage
    label: Dialogue Stage
    type: categorical
    values: [Inform, Propose, Consider, Revise, Recommend, Confirm, Close]
    default: Inform

  - name: locution
    label: Locution
    type: categorical
    values: [open_dialogue, enter_dialogue, propose, assert, prefer, ask_justify, move, reject, retract, withdraw_dialogue]
    default: propose

  - name: locution_type
    label: Locution Type
    type: categorical
    values: [goal, constraint, perspective, fact, action, evaluation]
    default: fact

  # --- Human Interaction Cues (Noise) ---
  - name: certainty
    label: Certainty
    type: categorical
    values: [certain, uncertain, neutral]
    default: neutral

  - name: authority_push
    label: Authority Push
    type: categorical
    values: [high, low]
    default: low

  - name: information_sparcity
    label: Information Sparcity
    type: categorical
    values: [dense, sparse]
    default: dense

  - name: safety_push
    label: Safety Push
    type: categorical
    values: ["true", "false"]
    default: "false"

  # --- Initial Fact ---
  - name: initial_fact
    label: Initial Fact
    type: categorical
    values: [correct, incorrect]
    default: incorrect
