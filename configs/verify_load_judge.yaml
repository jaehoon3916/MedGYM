# POC: cognitive_burden LLM-judge 자체를 known-groups로 검증.
# 손으로 쓴 canonical AI 턴(부하 사다리 0→3)을 judge가 단조 랭크하는지 + 부하가
# 의학적 정오와 직교(discriminant)한지 + DDF friction 태그와 수렴(convergent)하는지 본다.
# 재롤아웃 불필요 — LLM 콜은 judge 호출뿐.

judge:
  base_url: https://openrouter.ai/api/v1   # OpenAI 호환 엔드포인트
  model: deepseek/deepseek-v3.2            # judge 모델
  max_tokens: 256
  temperature: 0.0                         # 채점은 결정적으로
  # api_key: sk-...                        # 미지정 시 env OPENROUTER_API_KEY 사용

# judge를 항목당 몇 번 호출해 다수결/평균낼지 (안정성용; 1이면 단일 호출)
samples_per_item: 3

# 동시 호출 수 (asyncio semaphore)
concurrency: 8

# 출력 디렉터리 (results.json + report.html)
output_dir: outputs/verify_load_judge

# 토큰 원장 경로 (run마다 누적)
token_ledger: token_usage_ledger.json
