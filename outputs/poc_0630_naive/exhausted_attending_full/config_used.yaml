experiment:
  name: poc_0630_naive/exhausted_attending_full
  seed: 42
  max_turns: 8
  data_dir: data/sample_data
  n_cases: 1
  token_ledger: token_usage_ledger.json
  initial_user_state: null
  checkpoints:
  - 1
  - 2
  - 3
  - 4
  - 5
  - 6
  - 7
  - 8
  measure_ai_alone: true
plugins:
  user_llm:
    type: v3
    base_url: https://openrouter.ai/api/v1
    model: deepseek/deepseek-v3.2
    max_tokens: 256
    temperature: 0.8
    burden_samples_per_item: 3
    force_full_turns: true
    show_options: false
    persona: exhausted_attending
    info_condition: full
    information_sparsity: dense
  medical_llm:
    type: vllm
    base_url: https://openrouter.ai/api/v1
    model: openai/gpt-5-mini
    frame_style: command
    max_tokens: 512
    temperature: 0.7
    show_case_info: true
  fact_validator_llm:
    type: vllm
    base_url: https://openrouter.ai/api/v1
    model: deepseek/deepseek-v3.2
    max_tokens: 256
    temperature: 0.0
  final_judge:
    enabled: true
    type: vllm
    base_url: https://openrouter.ai/api/v1
    model: deepseek/deepseek-v3.2
    max_tokens: 256
    temperature: 0.0
  policy:
    type: naive
action_space_path: configs/action_space.yaml
concurrency: 20
