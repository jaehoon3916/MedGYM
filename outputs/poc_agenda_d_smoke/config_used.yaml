experiment:
  name: poc_agenda_d_smoke
  seed: 42
  max_turns: 10
  data_dir: data/sample_data
  n_cases: 3
  token_ledger: token_usage_ledger.json
  checkpoints:
  - 1
  - 2
  - 3
  - 4
  - 5
  - 6
  - 7
  - 8
plugins:
  user_llm:
    type: v3
    base_url: https://openrouter.ai/api/v1
    model: openai/gpt-4.1-mini
    max_tokens: 256
    temperature: 0.8
    burden_samples_per_item: 3
    force_full_turns: true
    show_options: true
    persona: veteran_attending
    info_condition: full
    information_sparsity: dense
  medical_llm:
    type: vllm
    base_url: https://openrouter.ai/api/v1
    model: deepseek/deepseek-v3.2
    frame_style: command
    max_tokens: 512
    temperature: 0.7
    show_case_info: true
  fact_validator_llm:
    type: vllm
    base_url: https://openrouter.ai/api/v1
    model: deepseek/deepseek-v3.2
    max_tokens: 128
    temperature: 0.0
  agenda_planner:
    type: vllm
    base_url: https://openrouter.ai/api/v1
    model: deepseek/deepseek-v3.2
    max_tokens: 512
    temperature: 0.0
  policy:
    type: agenda_action
    base_url: https://openrouter.ai/api/v1
    model: deepseek/deepseek-v3.2
    max_tokens: 512
    temperature: 0.0
  final_judge:
    enabled: false
    type: vllm
    base_url: https://openrouter.ai/api/v1
    model: deepseek/deepseek-v3.2
    max_tokens: 256
    temperature: 0.0
action_space_path: configs/action_space.yaml
concurrency: 3
