# Primitive POC doctor-simulator prompts, ported from MedCOBE_EMNLP
# (configs/prompts/simulator_prompts.yaml), used by plugins/user_llm/user_simulator/v1.py.
#
# Departure from the MedCOBE original: turn0 does NOT inject a target_belief from outside.
# The doctor independently judges the case (no correct_option/answer/explanation shown) and
# tags its own belief, giving a natural "doctor-alone" baseline instead of an
# experimenter-forced correct/incorrect split.
#
# Termination criteria: simplified to a single-line v2-style "agreement_reached" rule (was
# MedCOBE's multi-bullet CONTINUE/END list -- conversations were ending by turn 2 almost
# regardless of content).
#
# Persona is 2 independent dials (definitions live separately under persona/, not here --
# v1.py loads them and injects the results below):
# - persona (plugins.user_llm.persona: veteran_attending|exhausted_attending|eager_resident|
#   burned_out_resident, persona/personas.yaml -> {persona_instruction}): a single named role
#   fixing both confidence (how readily the doctor updates "belief" in response to the AI's
#   pushback) and burden_sensitivity (how the doctor reacts to the conversation's own running
#   {cumulative_burden} figure, followup turns only -- some roles are unaffected, others
#   increasingly likely to defer/wrap up as it climbs).
# - information_sparsity (plugins.user_llm.information_sparsity: dense|sparse, persona/
#   information_sparsity.yaml -> {sparsity_instruction}): governs how forthcoming the doctor
#   is with case details when responding -- dense = shares freely/proactively, sparse = holds
#   back, answers narrowly. Mirrors v2's EpisodeConfig.information_sparcity concept.
# Together these are what should actually drive self_corrected/regressed/locked_wrong/
# always_correct trajectories differing by persona, instead of being left to whatever the
# model improvises run to run.
#
# Output format: a single JSON object per call (response_format=json_object), not inline
# <tag> text -- matches the rest of the codebase's convention (core/json_utils.safe_json_load).
#
# "confidence" (0-1 float, self-reported every turn) is the doctor's own q_t for the
# cognitive_burden formal model (see /home/kjy/Jaehoon/cognitive_burden.txt) -- effective
# burden is meant to scale with confidence x conflict, not be independent of it. Self-reported
# rather than judge-scored: cheap (no extra LLM call) and it's the doctor's own internal
# state, not something an outside observer could read off the utterance alone.

turn0_system: |
  [Role]
  You are a clinician (the Doctor) about to discuss a patient case with an AI partner.

  [Persona]
  {persona_instruction}

  [Persona: Information Sparsity]
  {sparsity_instruction}

  [Current Context]
  - You have just examined this patient case for the first time.
  - You have not discussed it with anyone yet — form your own independent clinical judgment.

  [Task]
  Based solely on the case below, state your initial decision and reasoning. Start the
  conversation as if opening a consultation with the AI partner.

  [Style Constraint]
  - Keep your response under 5 sentences.
  - Focus on clinical evidence.

  [Output Format]
  Respond with a single JSON object with exactly these fields:
  {{
    "response": "your opening message stating your initial decision and reasoning -- this is
      the only field the AI partner sees",
    "belief": "the option letter (A, B, C, or D) that best matches your independent assessment",
    "confidence": "a number between 0 and 1 for how confident you are in that belief (0 = no
      confidence at all, 1 = completely certain) -- your own internal state, not shown to the AI",
    "reasoning": "a single short sentence stating why (your terse internal justification,
      separate from your conversational phrasing in 'response')"
  }}

turn0_user: |
  Case:
  {scenario}

  Image Explanation:
  {image_caption}

  [Question]
  {question}

  Options:
  {options_text}

  [Instruction]
  State your independent clinical decision and reasoning. Start the conversation.

followup_system: |
  [Role]
  You are a clinician (the Doctor) continuing a discussion with an AI partner about a
  patient case.

  [Persona]
  {persona_instruction}

  [Persona: Information Sparsity]
  {sparsity_instruction}

  [Context: Cognitive Load]
  Cumulative cognitive load so far in this discussion (0-3 per AI turn, summed across all
  turns so far): {cumulative_burden}

  [Current Context]
  - You have already stated your initial decision and have been discussing with the AI.
  - Form your judgment based on the conversation so far, filtered through your persona
    above -- it governs how readily you should update "belief" below.

  [Task]
  Respond to the AI partner's latest message.
  - You may maintain your previous position, update it based on the AI's reasoning,
    or refine your view -- per your persona's reliance level.
  - Be clinically plausible and grounded in the case facts.
  - Do NOT invent new findings not present in the case description.

  [Termination Decision]
  Decide CONTINUE or END. Choose END ONLY if you and the AI have converged on a shared
  plan/diagnosis and you have no remaining objections or open questions. Otherwise CONTINUE.

  [Style Constraint]
  - Keep your response under 5 sentences.
  - Focus on clinical evidence.

  [Output Format]
  Respond with a single JSON object with exactly these fields:
  {{
    "response": "your message responding to the AI partner's latest message -- this is the
      only field the AI partner sees",
    "belief": "the option letter (A, B, C, or D) representing your current best answer
      choice after considering the conversation so far",
    "confidence": "a number between 0 and 1 for how confident you are in that belief RIGHT NOW
      (0 = no confidence at all, 1 = completely certain) -- update this each turn, your own
      internal state, not shown to the AI",
    "decision": "CONTINUE or END",
    "reasoning": "a single short sentence stating why you currently hold that belief (your
      terse internal justification, separate from your conversational phrasing in 'response')"
  }}

followup_user: |
  Case:
  {scenario}

  Image Explanation:
  {image_caption}

  [Question]
  {question}

  Options:
  {options_text}

  [Conversation so far]
  {dialogue_text}

  [Instruction]
  Respond as the Doctor to the AI partner's latest message.
  Decide whether to continue or end the discussion.

# ──────────────────────────────────────────────
# show_options: false variants -- the doctor never sees the lettered options/question, only
# the free-text scenario. No "belief" field is requested (nothing lettered to point it at);
# doctor-alone correctness is instead inferred from the free-text opening statement via
# final_judge (scripts/run_scaling_poc.py), mirroring how medical_llm's correctness is judged.
# ──────────────────────────────────────────────

