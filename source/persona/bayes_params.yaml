# Biased-Bayesian belief parameters for the v4 user simulator (core/belief.py, user_simulator/v4.py).
# Maps the 4 named personas (confidence high/low × burden_sensitivity robust/sensitive — same 2×2
# as persona_*.yaml, whose style text v4 still injects into the utterance RENDERER) onto explicit
# belief-dynamics dials. Style text = how the doctor talks; these numbers = how the doctor thinks.
#
#   c0     initial confidence in own turn-0 pick        (confidence axis: high conf → high c0)
#   lambda anchoring to initial belief, [0,1)           (confidence axis: high conf → high lambda)
#   w      persuadability per unit of argued evidence   (confidence axis: high conf → low w)
#   rho    burden→capitulation coupling: w_eff = w·(1 + rho·B_t/B*)   (burden_sensitivity axis)
#
# Calibration lever — the steady-state flip threshold (min sustained per-option evidence |e|
# needed to eventually flip k0 -> alt) has a closed form:
#     e* = (lambda / (2*w)) * log( 3*c0 / (1-c0) )
# So the confidence axis (stubbornness) is set by the RATIO lambda/w and by c0's prior mass,
# NOT by w alone. Raising lambda anchors harder (noise can't flip a weakly-held belief);
# raising w speeds convergence to that steady state within the finite (8-turn) horizon.
# The 8-turn empirical threshold (verify_bayes_user.py Part A table) runs ~1-2x e* for low-conf
# (not yet converged) and ~= e* for high-conf.
#
# PROVISIONAL calibration (2026-07-02 initial; revised 2026-07-04 for veteran_attending): the
# initial pass only split confidence high/low (high-conf e*~0.45, low-conf e*~0.20 — a ~2x
# separation instead of the original 9x c0-only version, 0.10 vs 0.90). That flattened
# veteran_attending and exhausted_attending to the same e*~0.44, conflating "holds a strong
# prior" with "never revises." The 2026-07-04 revision splits them WITHIN the high-conf group:
# veteran_attending e*~0.29 (skeptical but movable — scrutinizes the AI, revises on a real
# argument), exhausted_attending e*~0.44 (unchanged — only strong argued evidence moves them).
# eager_resident/burned_out_resident stay low-conf, e*~0.20 (flip on moderate evidence, not
# near-noise). FINAL calibration still needs Part B (the tagger's real |e| distribution) +
# re-matching observed naive-arm flip rates against THIS revised veteran e* — the rates below
# were measured against the pre-split veteran e*~0.44 and have not been re-run since:
# (veteran recovery 0.33 / corruption 0.00, eager 0.50/0.11, exhausted 0.14/0.09,
# burned_out 0.43/0.27; project_medgym_persona_scaling_poc memory §4).
# A run config's plugins.user_llm.bayes: {c0, lambda, w, rho} always overrides these.

# kappa in [-1,1] = burden RESPONSE DIRECTION (rho = magnitude):
#   kappa > 0  defer   — burden raises persuadability -> caves to the AI  (over-reliance failure mode)
#   kappa < 0  retreat — burden raises anchoring -> falls back to own initial belief (digs in)
# At a burden_dropout the doctor thus ends on the AI's option (defer) or their own (retreat).
# ⚠ The per-persona kappa signs below are a PROVISIONAL modeling choice (no ground truth yet) —
#   this is the "who caves vs who digs in under stress" call; adjust freely.

defaults:
  q_close: 0.90        # END(agreement) when max_k b_t(k) >= q_close (config q_close overrides)

personas:
  #                        c0     lambda  w     rho    kappa   -> steady-state e* (no burden)
  veteran_attending:      {c0: 0.75, lambda: 0.36, w: 1.35, rho: 0.2, kappa: -0.2} # high·robust    skeptical, movable (e*~0.29)
  exhausted_attending:    {c0: 0.85, lambda: 0.40, w: 1.3, rho: 1.5, kappa:  0.7}  # high·sensitive caves when spent (e*~0.44)
  eager_resident:         {c0: 0.55, lambda: 0.30, w: 1.0, rho: 0.2, kappa:  0.5}  # low·robust     defers to AI (e*~0.20)
  burned_out_resident:    {c0: 0.55, lambda: 0.30, w: 1.0, rho: 1.5, kappa:  1.0}  # low·sensitive  fully caves (e*~0.20)
